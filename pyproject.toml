[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zoho-blueprint"
dynamic = ["version"]
description = "Run Zoho CRM Blueprint transitions properly, and find records that skipped them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josh Simnitt" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]
keywords = ["zoho", "zoho-crm", "blueprint", "crm", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/star7js/zoho-blueprint"
Issues = "https://github.com/star7js/zoho-blueprint/issues"

[project.scripts]
zoho-blueprint = "zoho_blueprint.cli:main"

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6", "mypy>=1.11", "types-requests"]

[tool.hatch.version]
path = "src/zoho_blueprint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zoho_blueprint"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
