name: publish

# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed, or a GitHub
# Release is published (which creates its tag). Uses PyPI
# trusted publishing, so no API token is stored: PyPI trusts this workflow
# in the "pypi" environment of star7js/zoho-blueprint.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/zoho_blueprint/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi
      - run: uv sync
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
